[build-system]
requires = ["setuptools >= 61.2"]
build-backend = "setuptools.build_meta"

[project]
name = "music-models"
version = "0.1.0"
dynamic = ["dependencies"]

[tool.setuptools.packages.find]
where=["src"]

[tool.setuptools.package-data]
public = ["*"]

[tool.setuptools.dynamic]
dependencies = {file=["requirements.txt"]}
